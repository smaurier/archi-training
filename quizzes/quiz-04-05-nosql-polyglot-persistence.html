<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NoSQL & Polyglot Persistence</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:2rem 1rem}.container{max-width:800px;margin:0 auto}h1{text-align:center;margin-bottom:.5rem;font-size:1.8rem;color:#fff}.subtitle{text-align:center;color:#8892b0;margin-bottom:2rem;font-size:1rem}.progress-bar-container{background:#0d1117;border-radius:10px;height:14px;margin-bottom:2rem;overflow:hidden}.progress-bar{background:linear-gradient(90deg,#0d6efd,#4dabf7);height:100%;width:0%;border-radius:10px;transition:width .4s ease}.progress-text{text-align:center;color:#8892b0;margin-bottom:1rem;font-size:.9rem}.card{background:#16213e;border-radius:12px;padding:2rem;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.3)}.question-label{font-size:.85rem;color:#4dabf7;text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem}.question-text{font-size:1.15rem;margin-bottom:1.2rem;line-height:1.5;color:#fff}pre{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:1rem;margin-bottom:1.2rem;overflow-x:auto;font-size:.95rem}code{font-family:'Consolas','Fira Code','Courier New',monospace;color:#c9d1d9}.options{list-style:none}.options li{margin-bottom:.5rem}.options label{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;background:#0d1117;border:2px solid #30363d;border-radius:8px;cursor:pointer;transition:border-color .2s,background .2s;font-size:1rem}.options label:hover{border-color:#4dabf7;background:#1c2a4a}.options input[type=radio]{accent-color:#0d6efd;width:18px;height:18px;flex-shrink:0}.btn{display:inline-block;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}.btn-primary{background:#0d6efd;color:#fff}.btn-primary:hover{background:#3b82f6}.btn-primary:disabled{background:#374151;cursor:not-allowed}.btn-restart{background:#238636;color:#fff;margin-top:1rem;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}.btn-restart:hover{background:#2ea043}.feedback{margin-top:1rem;padding:1rem 1.2rem;border-radius:8px;font-size:.95rem;line-height:1.5;display:none}.feedback.correct{background:#0f5132;border:1px solid #198754;color:#d1fae5;display:block}.feedback.wrong{background:#842029;border:1px solid #dc3545;color:#fdd;display:block}.score-card{text-align:center;padding:3rem 2rem}.score-card .score{font-size:3rem;font-weight:700;color:#4dabf7;margin-bottom:.5rem}.score-card .score-label{font-size:1.2rem;color:#8892b0;margin-bottom:1.5rem}.hidden{display:none}</style></head><body><div class="container"><h1>NoSQL & Polyglot Persistence</h1><p class="subtitle">Module 04 — Architecture BDD</p><div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div><p class="progress-text" id="progressText">Question 1 / 5</p><div id="quizContainer"></div><div id="scoreContainer" class="card score-card hidden"></div></div><script>const questions=[{"label":"Question 1","text":"Quelle est la regle d'or concernant le choix entre PostgreSQL et NoSQL ?","options":["Toujours utiliser MongoDB pour les nouvelles applications","PostgreSQL est le choix par defaut — introduire du NoSQL seulement quand un besoin specifique le justifie","Toujours utiliser au moins 3 bases differentes pour la resilience","Le NoSQL est toujours plus performant que le relationnel"],"answer":1,"explanation":"PostgreSQL couvre 90% des cas (relations, ACID, FTS). On ajoute du NoSQL quand un besoin specifique l'exige : latence &lt;1ms (Redis), recherche avancee (Elasticsearch), ecriture massive (Cassandra). Chaque base supplementaire = cout ops."},{"label":"Question 2","text":"Quel est le principal inconvenient du polyglot persistence ?","options":["Les bases NoSQL ne supportent pas le chiffrement","Chaque base supplementaire necessite monitoring, backup et expertise — charge ops non negligeable","Il est impossible de faire communiquer des bases differentes","Le polyglot persistence viole les principes SOLID"],"answer":1,"explanation":"Le polyglot persistence (PG + Redis + Elasticsearch + S3) optimise chaque besoin, mais chaque base supplementaire = monitoring, backup, expertise, maintenance. Une equipe de 4 ne devrait pas gerer 5 bases differentes."},{"label":"Question 3","text":"Pour quels cas d'usage Redis est-il le meilleur choix ?","options":["Transactions ACID complexes multi-tables","Donnees ephemeres : sessions, cache, paniers temporaires — grace a sa latence &lt;1ms et son TTL","Stockage de fichiers binaires volumineux","Relations complexes entre entites (graphes)"],"answer":1,"explanation":"Redis excelle pour les donnees temporaires a acces ultra-rapide : sessions (TTL 30min), paniers (TTL 7j), cache produits (TTL 5min). Son modele key-value avec latence &lt;1ms est ideal. Il n'est pas adapte aux relations complexes ni au stockage massif."},{"label":"Question 4","text":"Quand une base de donnees graphe (Neo4j) est-elle justifiee ?","options":["Quand les donnees depassent 10 millions de lignes","Quand les relations entre entites SONT la donnee principale (reseau social, recommandations, detection de fraude)","Quand on a besoin de transactions ACID","Quand l'equipe est petite et veut simplifier l'architecture"],"answer":1,"explanation":"Les bases graphes excellentes quand les traversals de relations sont le coeur du besoin (amis d'amis, chemins, clusters). Trade-off : le scaling horizontal est difficile, et pour des requetes simples un SQL JOIN suffit."},{"label":"Question 5","text":"Dans l'architecture ShopArch, pourquoi le panier est-il dans Redis et pas dans PostgreSQL ?","options":["PostgreSQL ne supporte pas le type JSON pour les paniers","Le panier est temporaire (TTL 7 jours), necessite une latence &lt;1ms, et n'a pas besoin de transactions ACID","Redis offre une meilleure integrite transactionnelle que PostgreSQL","Le panier contient trop de donnees pour PostgreSQL"],"answer":1,"explanation":"Le panier est ephemere (TTL 7j), lu/ecrit a chaque interaction utilisateur (latence critique), et ne necessite pas de relations complexes. Redis est ideal. Les commandes finalisees, elles, vont dans PostgreSQL pour l'ACID et l'historique."}];let currentQuestion=0,score=0,answered=false;function renderQuestion(){const q=questions[currentQuestion],total=questions.length;document.getElementById('progressBar').style.width=((currentQuestion/total)*100)+'%';document.getElementById('progressText').textContent=`Question ${currentQuestion+1} / ${total}`;let html=`<div class="card"><p class="question-label">${q.label}</p><p class="question-text">${q.text}</p>`;if(q.code)html+=`<pre><code>${q.code}</code></pre>`;html+=`<ul class="options">`;q.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`;});html+=`</ul><button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button><div class="feedback" id="feedback"></div></div>`;document.getElementById('quizContainer').innerHTML=html;document.querySelectorAll('input[name="q"]').forEach(r=>{r.addEventListener('change',()=>{document.getElementById('validateBtn').disabled=false;});});answered=false;}function validate(){if(answered){currentQuestion++;if(currentQuestion<questions.length)renderQuestion();else showScore();return;}answered=true;const selected=document.querySelector('input[name="q"]:checked');if(!selected)return;const val=parseInt(selected.value),q=questions[currentQuestion];const fb=document.getElementById('feedback'),btn=document.getElementById('validateBtn');document.querySelectorAll('input[name="q"]').forEach(r=>r.disabled=true);if(val===q.answer){score++;fb.className='feedback correct';fb.innerHTML=`<strong>Correct !</strong> ${q.explanation}`;}else{fb.className='feedback wrong';fb.innerHTML=`<strong>Incorrect.</strong> ${q.explanation}`;}btn.textContent=currentQuestion<questions.length-1?'Suivant':'Voir le score';}function showScore(){document.getElementById('quizContainer').classList.add('hidden');document.getElementById('progressBar').style.width='100%';document.getElementById('progressText').textContent='Termine !';const sc=document.getElementById('scoreContainer');sc.classList.remove('hidden');const pct=Math.round((score/questions.length)*100);let msg=pct===100?'Parfait !':pct>=60?'Bien joue !':'Continuez a reviser !';sc.innerHTML=`<div class="score">${score} / ${questions.length}</div><div class="score-label">${msg} (${pct}%)</div><button class="btn-restart" onclick="restart()">Recommencer</button>`;}function restart(){currentQuestion=0;score=0;answered=false;document.getElementById('scoreContainer').classList.add('hidden');document.getElementById('quizContainer').classList.remove('hidden');renderQuestion();}renderQuestion();</script></body></html>
