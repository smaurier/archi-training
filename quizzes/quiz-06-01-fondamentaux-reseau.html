<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Fondamentaux reseau</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:2rem 1rem}.container{max-width:800px;margin:0 auto}h1{text-align:center;margin-bottom:.5rem;font-size:1.8rem;color:#fff}.subtitle{text-align:center;color:#8892b0;margin-bottom:2rem;font-size:1rem}.progress-bar-container{background:#0d1117;border-radius:10px;height:14px;margin-bottom:2rem;overflow:hidden}.progress-bar{background:linear-gradient(90deg,#0d6efd,#4dabf7);height:100%;width:0%;border-radius:10px;transition:width .4s ease}.progress-text{text-align:center;color:#8892b0;margin-bottom:1rem;font-size:.9rem}.card{background:#16213e;border-radius:12px;padding:2rem;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.3)}.question-label{font-size:.85rem;color:#4dabf7;text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem}.question-text{font-size:1.15rem;margin-bottom:1.2rem;line-height:1.5;color:#fff}pre{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:1rem;margin-bottom:1.2rem;overflow-x:auto;font-size:.95rem}code{font-family:'Consolas','Fira Code','Courier New',monospace;color:#c9d1d9}.options{list-style:none}.options li{margin-bottom:.5rem}.options label{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;background:#0d1117;border:2px solid #30363d;border-radius:8px;cursor:pointer;transition:border-color .2s,background .2s;font-size:1rem}.options label:hover{border-color:#4dabf7;background:#1c2a4a}.options input[type=radio]{accent-color:#0d6efd;width:18px;height:18px;flex-shrink:0}.btn{display:inline-block;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}.btn-primary{background:#0d6efd;color:#fff}.btn-primary:hover{background:#3b82f6}.btn-primary:disabled{background:#374151;cursor:not-allowed}.btn-restart{background:#238636;color:#fff;margin-top:1rem;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}.btn-restart:hover{background:#2ea043}.feedback{margin-top:1rem;padding:1rem 1.2rem;border-radius:8px;font-size:.95rem;line-height:1.5;display:none}.feedback.correct{background:#0f5132;border:1px solid #198754;color:#d1fae5;display:block}.feedback.wrong{background:#842029;border:1px solid #dc3545;color:#fdd;display:block}.score-card{text-align:center;padding:3rem 2rem}.score-card .score{font-size:3rem;font-weight:700;color:#4dabf7;margin-bottom:.5rem}.score-card .score-label{font-size:1.2rem;color:#8892b0;margin-bottom:1.5rem}.hidden{display:none}</style></head><body><div class="container"><h1>Fondamentaux reseau</h1><p class="subtitle">Module 06 — Communication & Integration</p><div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div><p class="progress-text" id="progressText">Question 1 / 5</p><div id="quizContainer"></div><div id="scoreContainer" class="card score-card hidden"></div></div><script>const questions=[{"label":"Question 1","text":"Quel est le principal probleme de HTTP/1.1 resolu par HTTP/2 ?","options":["HTTP/1.1 ne supporte pas HTTPS","Le head-of-line blocking : HTTP/2 permet le multiplexing de plusieurs requetes sur une seule connexion TCP","HTTP/1.1 ne supporte pas les headers","HTTP/2 utilise un protocole binaire proprietaire"],"answer":1,"explanation":"HTTP/1.1 traite les requetes sequentiellement sur une connexion — une requete lente bloque les suivantes. HTTP/2 multiplexe les streams sur une seule connexion TCP. Trade-off : HTTP/2 souffre encore du HOL blocking au niveau TCP (resolu par HTTP/3/QUIC)."},{"label":"Question 2","text":"Pourquoi HTTP/3 utilise-t-il QUIC (UDP) plutot que TCP ?","options":["UDP est plus fiable que TCP","QUIC gere des streams independants — une perte sur un stream ne bloque pas les autres, et le handshake integre TLS 1.3","UDP est plus lent mais plus simple","HTTP/3 est compatible uniquement avec les navigateurs mobiles"],"answer":1,"explanation":"Avec TCP, une perte de paquet bloque TOUTES les streams multiplexees (HOL blocking au niveau transport). QUIC sur UDP gere chaque stream independamment. En bonus : 0-RTT pour les reconnexions. Trade-off : UDP est parfois bloque par des firewalls."},{"label":"Question 3","text":"Quelle est la difference entre SSE et WebSocket ?","options":["SSE est bidirectionnel, WebSocket est unidirectionnel","SSE est unidirectionnel (serveur→client) avec reconnexion automatique, WebSocket est bidirectionnel mais necessite une gestion manuelle de la reconnexion","Les deux sont identiques en termes de fonctionnalites","SSE utilise un protocole binaire, WebSocket utilise du texte"],"answer":1,"explanation":"SSE utilise HTTP standard (text/event-stream), supporte la reconnexion auto et passe les proxies/CDN. WebSocket utilise un protocole propre apres upgrade HTTP, permet la communication bidirectionnelle. SSE pour les notifications, WebSocket pour le chat."},{"label":"Question 4","text":"Qu'est-ce que le mTLS et en quoi differe-t-il du TLS classique ?","options":["mTLS chiffre les donnees deux fois pour plus de securite","Le TLS classique authentifie uniquement le serveur, le mTLS authentifie les deux parties (client ET serveur)","mTLS est une version allégée de TLS pour les mobiles","mTLS ne chiffre pas les donnees mais authentifie les parties"],"answer":1,"explanation":"Le mTLS (mutual TLS) ajoute l'authentification du client — le serveur verifie aussi le certificat du client. Utilise entre microservices pour empecher un attaquant dans le reseau de se faire passer pour un service. Gere par un service mesh en production."},{"label":"Question 5","text":"A quoi sert le TCP connection pooling dans une architecture microservices ?","options":["A limiter le nombre de microservices dans le cluster","A reutiliser les connexions TCP existantes pour eviter le cout du handshake a chaque requete","A compresser le trafic TCP entre services","A router le trafic TCP vers le bon service"],"answer":1,"explanation":"Chaque nouvelle connexion TCP necessite un handshake (1 RTT) + TLS (1-2 RTT). Le connection pooling maintient des connexions ouvertes et les reutilise. Trade-off : les connexions idle consomment de la memoire cote serveur."}];let currentQuestion=0,score=0,answered=false;function renderQuestion(){const q=questions[currentQuestion],total=questions.length;document.getElementById('progressBar').style.width=((currentQuestion/total)*100)+'%';document.getElementById('progressText').textContent=`Question ${currentQuestion+1} / ${total}`;let html=`<div class="card"><p class="question-label">${q.label}</p><p class="question-text">${q.text}</p>`;if(q.code)html+=`<pre><code>${q.code}</code></pre>`;html+=`<ul class="options">`;q.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`;});html+=`</ul><button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button><div class="feedback" id="feedback"></div></div>`;document.getElementById('quizContainer').innerHTML=html;document.querySelectorAll('input[name="q"]').forEach(r=>{r.addEventListener('change',()=>{document.getElementById('validateBtn').disabled=false;});});answered=false;}function validate(){if(answered){currentQuestion++;if(currentQuestion<questions.length)renderQuestion();else showScore();return;}answered=true;const selected=document.querySelector('input[name="q"]:checked');if(!selected)return;const val=parseInt(selected.value),q=questions[currentQuestion];const fb=document.getElementById('feedback'),btn=document.getElementById('validateBtn');document.querySelectorAll('input[name="q"]').forEach(r=>r.disabled=true);if(val===q.answer){score++;fb.className='feedback correct';fb.innerHTML=`<strong>Correct !</strong> ${q.explanation}`;}else{fb.className='feedback wrong';fb.innerHTML=`<strong>Incorrect.</strong> ${q.explanation}`;}btn.textContent=currentQuestion<questions.length-1?'Suivant':'Voir le score';}function showScore(){document.getElementById('quizContainer').classList.add('hidden');document.getElementById('progressBar').style.width='100%';document.getElementById('progressText').textContent='Termine !';const sc=document.getElementById('scoreContainer');sc.classList.remove('hidden');const pct=Math.round((score/questions.length)*100);let msg=pct===100?'Parfait !':pct>=60?'Bien joue !':'Continuez a reviser !';sc.innerHTML=`<div class="score">${score} / ${questions.length}</div><div class="score-label">${msg} (${pct}%)</div><button class="btn-restart" onclick="restart()">Recommencer</button>`;}function restart(){currentQuestion=0;score=0;answered=false;document.getElementById('scoreContainer').classList.add('hidden');document.getElementById('quizContainer').classList.remove('hidden');renderQuestion();}renderQuestion();</script></body></html>
