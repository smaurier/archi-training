<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Search Architecture</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:2rem 1rem}.container{max-width:800px;margin:0 auto}h1{text-align:center;margin-bottom:.5rem;font-size:1.8rem;color:#fff}.subtitle{text-align:center;color:#8892b0;margin-bottom:2rem;font-size:1rem}.progress-bar-container{background:#0d1117;border-radius:10px;height:14px;margin-bottom:2rem;overflow:hidden}.progress-bar{background:linear-gradient(90deg,#0d6efd,#4dabf7);height:100%;width:0%;border-radius:10px;transition:width .4s ease}.progress-text{text-align:center;color:#8892b0;margin-bottom:1rem;font-size:.9rem}.card{background:#16213e;border-radius:12px;padding:2rem;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.3)}.question-label{font-size:.85rem;color:#4dabf7;text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem}.question-text{font-size:1.15rem;margin-bottom:1.2rem;line-height:1.5;color:#fff}pre{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:1rem;margin-bottom:1.2rem;overflow-x:auto;font-size:.95rem}code{font-family:'Consolas','Fira Code','Courier New',monospace;color:#c9d1d9}.options{list-style:none}.options li{margin-bottom:.5rem}.options label{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;background:#0d1117;border:2px solid #30363d;border-radius:8px;cursor:pointer;transition:border-color .2s,background .2s;font-size:1rem}.options label:hover{border-color:#4dabf7;background:#1c2a4a}.options input[type=radio]{accent-color:#0d6efd;width:18px;height:18px;flex-shrink:0}.btn{display:inline-block;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}.btn-primary{background:#0d6efd;color:#fff}.btn-primary:hover{background:#3b82f6}.btn-primary:disabled{background:#374151;cursor:not-allowed}.btn-restart{background:#238636;color:#fff;margin-top:1rem;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}.btn-restart:hover{background:#2ea043}.feedback{margin-top:1rem;padding:1rem 1.2rem;border-radius:8px;font-size:.95rem;line-height:1.5;display:none}.feedback.correct{background:#0f5132;border:1px solid #198754;color:#d1fae5;display:block}.feedback.wrong{background:#842029;border:1px solid #dc3545;color:#fdd;display:block}.score-card{text-align:center;padding:3rem 2rem}.score-card .score{font-size:3rem;font-weight:700;color:#4dabf7;margin-bottom:.5rem}.score-card .score-label{font-size:1.2rem;color:#8892b0;margin-bottom:1.5rem}.hidden{display:none}</style></head><body><div class="container"><h1>Search Architecture</h1><p class="subtitle">Module 04 — Architecture BDD</p><div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div><p class="progress-text" id="progressText">Question 1 / 5</p><div id="quizContainer"></div><div id="scoreContainer" class="card score-card hidden"></div></div><script>const questions=[{"label":"Question 1","text":"A partir de quel volume de donnees Elasticsearch devient-il preferable a PostgreSQL FTS ?","options":["Des 1000 lignes","Au-dela de ~500K lignes, ou quand on a besoin de fuzzy search, facettes et suggestions","Elasticsearch est toujours preferable, meme pour de petits volumes","PostgreSQL FTS n'existe pas, il faut toujours Elasticsearch"],"answer":1,"explanation":"PostgreSQL FTS (tsvector + GIN) suffit pour 10K-500K lignes avec zero infra supplementaire. Elasticsearch apporte fuzzy search, facettes, suggestions et autocomplete avancee, mais avec un cout ops (cluster dedie). Trade-off : complexite ops vs richesse fonctionnelle."},{"label":"Question 2","text":"Pourquoi utiliser une interface SearchProvider plutot que coupler directement le code a Elasticsearch ?","options":["Elasticsearch n'a pas d'API stable","Le SearchProvider permet de swapper le moteur de recherche sans modifier le code metier (Dependency Inversion)","L'interface est obligatoire pour des raisons de securite","Le SearchProvider est plus rapide qu'un appel direct"],"answer":1,"explanation":"L'abstraction SearchProvider respecte le Dependency Inversion Principle : le code metier depend d'une interface, pas d'une implementation. On peut migrer de PG FTS vers Elasticsearch (ou Meilisearch) sans toucher au code appelant. Facilite aussi les tests (mock du provider)."},{"label":"Question 3","text":"Quelle est la difference entre la recherche keyword (BM25) et la recherche vector (embeddings) ?","options":["BM25 comprend le sens semantique, les embeddings comparent les mots exacts","BM25 compare les mots exacts (lexical), les embeddings comprennent le sens semantique via des vecteurs","Les deux sont identiques en termes de resultats","BM25 est toujours superieur aux embeddings"],"answer":1,"explanation":"BM25 cherche des correspondances lexicales exactes. Le vector search encode le sens dans un espace vectoriel — 'vetement chaud hiver' trouve 'doudoune' meme sans le mot exact. La fusion RRF (Reciprocal Rank Fusion) combine les deux pour le meilleur des deux mondes."},{"label":"Question 4","text":"Pourquoi appliquer un debounce de 300ms sur la recherche front-end ?","options":["Pour ralentir l'interface et eviter les clics accidentels","Pour ne pas envoyer une requete a chaque frappe clavier, ce qui surchargerait le serveur","Pour respecter le rate limiting de l'API","Le debounce est obligatoire pour le SEO"],"answer":1,"explanation":"Sans debounce, taper 'chaussure' envoie 9 requetes (une par lettre). Avec un debounce de 300ms, on attend que l'utilisateur arrete de taper avant d'envoyer UNE seule requete. Combine avec AbortController pour annuler les requetes precedentes."},{"label":"Question 5","text":"A quoi servent les weights (A, B, C, D) dans PostgreSQL full-text search ?","options":["A definir les permissions d'acces par role","A booster certains champs dans le ranking : un match dans le titre (A) vaut plus qu'un match dans la description (B)","A limiter le nombre de resultats par categorie","A configurer la langue du stemming"],"answer":1,"explanation":"Les weights permettent le boosting : setweight(to_tsvector('french', name), 'A') donne plus de poids au titre qu'a la description (B) ou la categorie (C). Ainsi, un produit dont le TITRE matche la recherche apparait avant un produit ou seule la description matche."}];let currentQuestion=0,score=0,answered=false;function renderQuestion(){const q=questions[currentQuestion],total=questions.length;document.getElementById('progressBar').style.width=((currentQuestion/total)*100)+'%';document.getElementById('progressText').textContent=`Question ${currentQuestion+1} / ${total}`;let html=`<div class="card"><p class="question-label">${q.label}</p><p class="question-text">${q.text}</p>`;if(q.code)html+=`<pre><code>${q.code}</code></pre>`;html+=`<ul class="options">`;q.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`;});html+=`</ul><button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button><div class="feedback" id="feedback"></div></div>`;document.getElementById('quizContainer').innerHTML=html;document.querySelectorAll('input[name="q"]').forEach(r=>{r.addEventListener('change',()=>{document.getElementById('validateBtn').disabled=false;});});answered=false;}function validate(){if(answered){currentQuestion++;if(currentQuestion<questions.length)renderQuestion();else showScore();return;}answered=true;const selected=document.querySelector('input[name="q"]:checked');if(!selected)return;const val=parseInt(selected.value),q=questions[currentQuestion];const fb=document.getElementById('feedback'),btn=document.getElementById('validateBtn');document.querySelectorAll('input[name="q"]').forEach(r=>r.disabled=true);if(val===q.answer){score++;fb.className='feedback correct';fb.innerHTML=`<strong>Correct !</strong> ${q.explanation}`;}else{fb.className='feedback wrong';fb.innerHTML=`<strong>Incorrect.</strong> ${q.explanation}`;}btn.textContent=currentQuestion<questions.length-1?'Suivant':'Voir le score';}function showScore(){document.getElementById('quizContainer').classList.add('hidden');document.getElementById('progressBar').style.width='100%';document.getElementById('progressText').textContent='Termine !';const sc=document.getElementById('scoreContainer');sc.classList.remove('hidden');const pct=Math.round((score/questions.length)*100);let msg=pct===100?'Parfait !':pct>=60?'Bien joue !':'Continuez a reviser !';sc.innerHTML=`<div class="score">${score} / ${questions.length}</div><div class="score-label">${msg} (${pct}%)</div><button class="btn-restart" onclick="restart()">Recommencer</button>`;}function restart(){currentQuestion=0;score=0;answered=false;document.getElementById('scoreContainer').classList.add('hidden');document.getElementById('quizContainer').classList.remove('hidden');renderQuestion();}renderQuestion();</script></body></html>
