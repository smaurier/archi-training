<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Micro-frontends</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:2rem 1rem}.container{max-width:800px;margin:0 auto}h1{text-align:center;margin-bottom:.5rem;font-size:1.8rem;color:#fff}.subtitle{text-align:center;color:#8892b0;margin-bottom:2rem;font-size:1rem}.progress-bar-container{background:#0d1117;border-radius:10px;height:14px;margin-bottom:2rem;overflow:hidden}.progress-bar{background:linear-gradient(90deg,#0d6efd,#4dabf7);height:100%;width:0%;border-radius:10px;transition:width .4s ease}.progress-text{text-align:center;color:#8892b0;margin-bottom:1rem;font-size:.9rem}.card{background:#16213e;border-radius:12px;padding:2rem;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.3)}.question-label{font-size:.85rem;color:#4dabf7;text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem}.question-text{font-size:1.15rem;margin-bottom:1.2rem;line-height:1.5;color:#fff}pre{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:1rem;margin-bottom:1.2rem;overflow-x:auto;font-size:.95rem}code{font-family:'Consolas','Fira Code','Courier New',monospace;color:#c9d1d9}.options{list-style:none}.options li{margin-bottom:.5rem}.options label{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;background:#0d1117;border:2px solid #30363d;border-radius:8px;cursor:pointer;transition:border-color .2s,background .2s;font-size:1rem}.options label:hover{border-color:#4dabf7;background:#1c2a4a}.options input[type=radio]{accent-color:#0d6efd;width:18px;height:18px;flex-shrink:0}.btn{display:inline-block;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}.btn-primary{background:#0d6efd;color:#fff}.btn-primary:hover{background:#3b82f6}.btn-primary:disabled{background:#374151;cursor:not-allowed}.btn-restart{background:#238636;color:#fff;margin-top:1rem;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}.btn-restart:hover{background:#2ea043}.feedback{margin-top:1rem;padding:1rem 1.2rem;border-radius:8px;font-size:.95rem;line-height:1.5;display:none}.feedback.correct{background:#0f5132;border:1px solid #198754;color:#d1fae5;display:block}.feedback.wrong{background:#842029;border:1px solid #dc3545;color:#fdd;display:block}.score-card{text-align:center;padding:3rem 2rem}.score-card .score{font-size:3rem;font-weight:700;color:#4dabf7;margin-bottom:.5rem}.score-card .score-label{font-size:1.2rem;color:#8892b0;margin-bottom:1.5rem}.hidden{display:none}</style></head><body><div class="container"><h1>Micro-frontends</h1><p class="subtitle">Module 05 — Architecture Frontend</p><div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div><p class="progress-text" id="progressText">Question 1 / 5</p><div id="quizContainer"></div><div id="scoreContainer" class="card score-card hidden"></div></div><script>const questions=[{"label":"Question 1","text":"Quand NE PAS utiliser des micro-frontends ?","options":["Quand on a plus de 10 developpeurs","Quand l'equipe fait &lt; 5 devs, un seul domaine metier, stack homogene ou pour un MVP — le cout d'orchestration ne se justifie pas","Quand on utilise React","Quand l'application a plus de 50 pages"],"answer":1,"explanation":"Les micro-frontends resolvent des problemes organisationnels (deploiement independant, autonomie d'equipe). Avec une petite equipe et un seul domaine, le monolithe est plus simple. Le cout d'orchestration (communication inter-apps, shared deps) est significatif."},{"label":"Question 2","text":"Quel pattern de communication est recommande entre micro-frontends ?","options":["Un store Redux global partage entre toutes les apps","Des Custom Events (window.dispatchEvent) avec la convention {app}:{domain}:{action}","Des appels HTTP entre micro-frontends","Un WebSocket partage entre toutes les apps"],"answer":1,"explanation":"Les Custom Events offrent un decouplage total — l'emetteur ne connait pas le recepteur. Convention : {app}:{domain}:{action} (ex: catalog:product:selected). Eviter le shared state (couplage) sauf pour l'auth et le panier transversaux."},{"label":"Question 3","text":"Quelle approche de micro-frontend utilise Module Federation de webpack ?","options":["Des iframes independantes pour chaque micro-frontend","Le partage de modules JavaScript a l'execution entre applications deployees independamment","Un bundling unique de toutes les applications","Des Web Components natifs sans framework"],"answer":1,"explanation":"Module Federation permet a des builds webpack separees de partager des modules a l'execution (remote/host). Chaque app est deployee independamment mais peut importer des composants d'autres apps. Trade-off : couplage a webpack, complexite de versioning des dependances partagees."},{"label":"Question 4","text":"Quel est le role du shell application dans une architecture micro-frontend ?","options":["Generer le code de chaque micro-frontend au build time","Fournir l'infrastructure commune : routing, auth, layout, chargement des micro-frontends","Stocker toutes les donnees partagees","Compiler les micro-frontends en un seul bundle"],"answer":1,"explanation":"Le shell est le conteneur global : il gere le routing principal, l'authentification, le layout commun (header, footer), et le chargement dynamique des micro-frontends. C'est le hall d'entree du centre commercial."},{"label":"Question 5","text":"Quel probleme pose le partage de dependances (React, lodash) entre micro-frontends ?","options":["Les dependances ne peuvent pas etre partagees entre micro-frontends","Le versioning divergent peut causer des conflits a l'execution (deux versions de React) et le singleton problem","Le partage de dependances est toujours benefique sans inconvenient","Les dependances partagees empechent le deploiement independant"],"answer":1,"explanation":"Si l'app A utilise React 17 et l'app B React 18, le partage peut causer des conflits. Module Federation gere le versioning (singleton: true), mais c'est fragile. Trade-off : dupliquer les deps (plus de poids) vs partager (risque de conflit)."}];let currentQuestion=0,score=0,answered=false;function renderQuestion(){const q=questions[currentQuestion],total=questions.length;document.getElementById('progressBar').style.width=((currentQuestion/total)*100)+'%';document.getElementById('progressText').textContent=`Question ${currentQuestion+1} / ${total}`;let html=`<div class="card"><p class="question-label">${q.label}</p><p class="question-text">${q.text}</p>`;if(q.code)html+=`<pre><code>${q.code}</code></pre>`;html+=`<ul class="options">`;q.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`;});html+=`</ul><button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button><div class="feedback" id="feedback"></div></div>`;document.getElementById('quizContainer').innerHTML=html;document.querySelectorAll('input[name="q"]').forEach(r=>{r.addEventListener('change',()=>{document.getElementById('validateBtn').disabled=false;});});answered=false;}function validate(){if(answered){currentQuestion++;if(currentQuestion<questions.length)renderQuestion();else showScore();return;}answered=true;const selected=document.querySelector('input[name="q"]:checked');if(!selected)return;const val=parseInt(selected.value),q=questions[currentQuestion];const fb=document.getElementById('feedback'),btn=document.getElementById('validateBtn');document.querySelectorAll('input[name="q"]').forEach(r=>r.disabled=true);if(val===q.answer){score++;fb.className='feedback correct';fb.innerHTML=`<strong>Correct !</strong> ${q.explanation}`;}else{fb.className='feedback wrong';fb.innerHTML=`<strong>Incorrect.</strong> ${q.explanation}`;}btn.textContent=currentQuestion<questions.length-1?'Suivant':'Voir le score';}function showScore(){document.getElementById('quizContainer').classList.add('hidden');document.getElementById('progressBar').style.width='100%';document.getElementById('progressText').textContent='Termine !';const sc=document.getElementById('scoreContainer');sc.classList.remove('hidden');const pct=Math.round((score/questions.length)*100);let msg=pct===100?'Parfait !':pct>=60?'Bien joue !':'Continuez a reviser !';sc.innerHTML=`<div class="score">${score} / ${questions.length}</div><div class="score-label">${msg} (${pct}%)</div><button class="btn-restart" onclick="restart()">Recommencer</button>`;}function restart(){currentQuestion=0;score=0;answered=false;document.getElementById('scoreContainer').classList.add('hidden');document.getElementById('quizContainer').classList.remove('hidden');renderQuestion();}renderQuestion();</script></body></html>
