<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>REST avance</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:2rem 1rem}.container{max-width:800px;margin:0 auto}h1{text-align:center;margin-bottom:.5rem;font-size:1.8rem;color:#fff}.subtitle{text-align:center;color:#8892b0;margin-bottom:2rem;font-size:1rem}.progress-bar-container{background:#0d1117;border-radius:10px;height:14px;margin-bottom:2rem;overflow:hidden}.progress-bar{background:linear-gradient(90deg,#0d6efd,#4dabf7);height:100%;width:0%;border-radius:10px;transition:width .4s ease}.progress-text{text-align:center;color:#8892b0;margin-bottom:1rem;font-size:.9rem}.card{background:#16213e;border-radius:12px;padding:2rem;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.3)}.question-label{font-size:.85rem;color:#4dabf7;text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem}.question-text{font-size:1.15rem;margin-bottom:1.2rem;line-height:1.5;color:#fff}pre{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:1rem;margin-bottom:1.2rem;overflow-x:auto;font-size:.95rem}code{font-family:'Consolas','Fira Code','Courier New',monospace;color:#c9d1d9}.options{list-style:none}.options li{margin-bottom:.5rem}.options label{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;background:#0d1117;border:2px solid #30363d;border-radius:8px;cursor:pointer;transition:border-color .2s,background .2s;font-size:1rem}.options label:hover{border-color:#4dabf7;background:#1c2a4a}.options input[type=radio]{accent-color:#0d6efd;width:18px;height:18px;flex-shrink:0}.btn{display:inline-block;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}.btn-primary{background:#0d6efd;color:#fff}.btn-primary:hover{background:#3b82f6}.btn-primary:disabled{background:#374151;cursor:not-allowed}.btn-restart{background:#238636;color:#fff;margin-top:1rem;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}.btn-restart:hover{background:#2ea043}.feedback{margin-top:1rem;padding:1rem 1.2rem;border-radius:8px;font-size:.95rem;line-height:1.5;display:none}.feedback.correct{background:#0f5132;border:1px solid #198754;color:#d1fae5;display:block}.feedback.wrong{background:#842029;border:1px solid #dc3545;color:#fdd;display:block}.score-card{text-align:center;padding:3rem 2rem}.score-card .score{font-size:3rem;font-weight:700;color:#4dabf7;margin-bottom:.5rem}.score-card .score-label{font-size:1.2rem;color:#8892b0;margin-bottom:1.5rem}.hidden{display:none}</style></head><body><div class="container"><h1>REST avance</h1><p class="subtitle">Module 06 — Communication & Integration</p><div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div><p class="progress-text" id="progressText">Question 1 / 5</p><div id="quizContainer"></div><div id="scoreContainer" class="card score-card hidden"></div></div><script>const questions=[{"label":"Question 1","text":"Quel est l'avantage de la pagination cursor par rapport a la pagination offset ?","options":["La pagination cursor est plus simple a implementer","La pagination cursor est stable (pas de doublons si des elements sont inseres) et performante en O(limit) constant, contrairement a l'offset qui degrade lineairement","La pagination cursor affiche le numero de page","La pagination cursor est toujours plus rapide pour les petites tables"],"answer":1,"explanation":"Offset : la DB scanne offset+limit lignes, et des insertions entre deux pages causent des doublons. Cursor : la DB cherche a partir du dernier element vu, en O(limit) constant. Trade-off : cursor ne permet pas de sauter a la 'page 7' — ideal pour le scroll infini, pas pour les tables admin."},{"label":"Question 2","text":"Qu'est-ce que HATEOAS et quel probleme resout-il ?","options":["Un format d'encodage binaire pour les API REST","L'API guide le client vers les actions possibles via des liens dans la reponse — le client decouvre les possibilites sans coder les URLs en dur","Un protocole de securite pour les webhooks","Un outil de documentation automatique des API"],"answer":1,"explanation":"HATEOAS (Hypermedia as the Engine of Application State) inclut des liens _links dans chaque reponse (self, publish, delete). Le client n'a pas besoin de construire les URLs. Trade-off : plus verbeux, peu adopte en pratique hors JSON-LD/Hydra."},{"label":"Question 3","text":"Pourquoi ne jamais mettre Vary: Cookie sur une reponse servie par un CDN ?","options":["Le header Vary n'est pas supporte par les CDN","Chaque utilisateur a un cookie unique, donc le CDN ne peut jamais servir une reponse cachee a un autre utilisateur — le hit ratio tombe a 0%","Les cookies sont trop volumineux pour le header Vary","Vary: Cookie desactive le chiffrement HTTPS"],"answer":1,"explanation":"Vary indique aux caches intermediaires quels headers influencent la reponse. Vary: Cookie signifie une version par cookie unique → aucun partage de cache possible. Solution : le Personalization Shell Pattern (page publique + fetch client-side)."},{"label":"Question 4","text":"Comment fonctionne l'ETag pour le cache conditionnel ?","options":["L'ETag force le navigateur a toujours recharger la page","Le serveur envoie un ETag (hash du contenu). Le client renvoie If-None-Match lors de la requete suivante. Si le contenu n'a pas change, le serveur repond 304 Not Modified","L'ETag remplace le header Content-Type","L'ETag est un token d'authentification"],"answer":1,"explanation":"ETag evite de retransmettre un contenu identique. Le client garde le hash, le serveur compare : si identique → 304 (pas de body, economie de bande passante). Trade-off : le serveur doit quand meme calculer le hash a chaque requete."},{"label":"Question 5","text":"Comment signaler la deprecation d'un endpoint API ?","options":["Supprimer l'endpoint immediatement sans prevenir","Ajouter un header Deprecation avec la date de sunset et un header Link vers la nouvelle version","Ralentir progressivement les temps de reponse de l'endpoint","Retourner une erreur 500 aleatoirement"],"answer":1,"explanation":"Le header Deprecation (RFC 8594) avec une date de sunset + un header Link vers le remplacement permet aux clients de migrer. Ajouter un warning dans la reponse et un sunset date dans la documentation. Supprimer seulement apres la date annoncee."}];let currentQuestion=0,score=0,answered=false;function renderQuestion(){const q=questions[currentQuestion],total=questions.length;document.getElementById('progressBar').style.width=((currentQuestion/total)*100)+'%';document.getElementById('progressText').textContent=`Question ${currentQuestion+1} / ${total}`;let html=`<div class="card"><p class="question-label">${q.label}</p><p class="question-text">${q.text}</p>`;if(q.code)html+=`<pre><code>${q.code}</code></pre>`;html+=`<ul class="options">`;q.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`;});html+=`</ul><button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button><div class="feedback" id="feedback"></div></div>`;document.getElementById('quizContainer').innerHTML=html;document.querySelectorAll('input[name="q"]').forEach(r=>{r.addEventListener('change',()=>{document.getElementById('validateBtn').disabled=false;});});answered=false;}function validate(){if(answered){currentQuestion++;if(currentQuestion<questions.length)renderQuestion();else showScore();return;}answered=true;const selected=document.querySelector('input[name="q"]:checked');if(!selected)return;const val=parseInt(selected.value),q=questions[currentQuestion];const fb=document.getElementById('feedback'),btn=document.getElementById('validateBtn');document.querySelectorAll('input[name="q"]').forEach(r=>r.disabled=true);if(val===q.answer){score++;fb.className='feedback correct';fb.innerHTML=`<strong>Correct !</strong> ${q.explanation}`;}else{fb.className='feedback wrong';fb.innerHTML=`<strong>Incorrect.</strong> ${q.explanation}`;}btn.textContent=currentQuestion<questions.length-1?'Suivant':'Voir le score';}function showScore(){document.getElementById('quizContainer').classList.add('hidden');document.getElementById('progressBar').style.width='100%';document.getElementById('progressText').textContent='Termine !';const sc=document.getElementById('scoreContainer');sc.classList.remove('hidden');const pct=Math.round((score/questions.length)*100);let msg=pct===100?'Parfait !':pct>=60?'Bien joue !':'Continuez a reviser !';sc.innerHTML=`<div class="score">${score} / ${questions.length}</div><div class="score-label">${msg} (${pct}%)</div><button class="btn-restart" onclick="restart()">Recommencer</button>`;}function restart(){currentQuestion=0;score=0;answered=false;document.getElementById('scoreContainer').classList.add('hidden');document.getElementById('quizContainer').classList.remove('hidden');renderQuestion();}renderQuestion();</script></body></html>
