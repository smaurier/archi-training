<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>API Gateway & BFF</title><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:2rem 1rem}.container{max-width:800px;margin:0 auto}h1{text-align:center;margin-bottom:.5rem;font-size:1.8rem;color:#fff}.subtitle{text-align:center;color:#8892b0;margin-bottom:2rem;font-size:1rem}.progress-bar-container{background:#0d1117;border-radius:10px;height:14px;margin-bottom:2rem;overflow:hidden}.progress-bar{background:linear-gradient(90deg,#0d6efd,#4dabf7);height:100%;width:0%;border-radius:10px;transition:width .4s ease}.progress-text{text-align:center;color:#8892b0;margin-bottom:1rem;font-size:.9rem}.card{background:#16213e;border-radius:12px;padding:2rem;margin-bottom:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,.3)}.question-label{font-size:.85rem;color:#4dabf7;text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem}.question-text{font-size:1.15rem;margin-bottom:1.2rem;line-height:1.5;color:#fff}pre{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:1rem;margin-bottom:1.2rem;overflow-x:auto;font-size:.95rem}code{font-family:'Consolas','Fira Code','Courier New',monospace;color:#c9d1d9}.options{list-style:none}.options li{margin-bottom:.5rem}.options label{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;background:#0d1117;border:2px solid #30363d;border-radius:8px;cursor:pointer;transition:border-color .2s,background .2s;font-size:1rem}.options label:hover{border-color:#4dabf7;background:#1c2a4a}.options input[type=radio]{accent-color:#0d6efd;width:18px;height:18px;flex-shrink:0}.btn{display:inline-block;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}.btn-primary{background:#0d6efd;color:#fff}.btn-primary:hover{background:#3b82f6}.btn-primary:disabled{background:#374151;cursor:not-allowed}.btn-restart{background:#238636;color:#fff;margin-top:1rem;padding:.7rem 2rem;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}.btn-restart:hover{background:#2ea043}.feedback{margin-top:1rem;padding:1rem 1.2rem;border-radius:8px;font-size:.95rem;line-height:1.5;display:none}.feedback.correct{background:#0f5132;border:1px solid #198754;color:#d1fae5;display:block}.feedback.wrong{background:#842029;border:1px solid #dc3545;color:#fdd;display:block}.score-card{text-align:center;padding:3rem 2rem}.score-card .score{font-size:3rem;font-weight:700;color:#4dabf7;margin-bottom:.5rem}.score-card .score-label{font-size:1.2rem;color:#8892b0;margin-bottom:1.5rem}.hidden{display:none}</style></head><body><div class="container"><h1>API Gateway & BFF</h1><p class="subtitle">Module 06 — Communication & Integration</p><div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div><p class="progress-text" id="progressText">Question 1 / 5</p><div id="quizContainer"></div><div id="scoreContainer" class="card score-card hidden"></div></div><script>const questions=[{"label":"Question 1","text":"Quelle est la difference entre un API Gateway et un Service Mesh ?","options":["Ils font exactement la meme chose","L'API Gateway gere le trafic Nord-Sud (clients→services : routing, auth, rate limiting). Le Service Mesh gere le trafic Est-Ouest (service→service : mTLS, circuit breaker, observabilite)","L'API Gateway est pour le cloud, le Service Mesh pour le on-premise","Le Service Mesh remplace completement l'API Gateway"],"answer":1,"explanation":"L'API Gateway est le point d'entree unique pour les clients externes. Le Service Mesh (Istio, Linkerd) gere la communication interne entre services via des sidecar proxies. Les deux sont complementaires. Trade-off : le Service Mesh ajoute de la latence (sidecar) et de la complexite ops."},{"label":"Question 2","text":"Qu'est-ce que le pattern BFF (Backend for Frontend) et quel probleme resout-il ?","options":["Un framework frontend pour le server-side rendering","Un backend dedie a un client specifique (web, mobile) qui agrege les appels microservices et gere les tokens cote serveur","Un outil de build pour les applications frontend","Un pattern de caching pour les API publiques"],"answer":1,"explanation":"Le BFF agrege les appels a plusieurs microservices en une seule reponse adaptee au client, gere les tokens cote serveur (pas exposes au navigateur), et isole la logique de presentation. Chaque type de client a son propre BFF. Trade-off : plus de code backend a maintenir."},{"label":"Question 3","text":"Pourquoi le rate limiting est-il une responsabilite de l'API Gateway ?","options":["Le rate limiting ne peut etre implemente que dans un reverse proxy","Centraliser le rate limiting au gateway protege tous les services en amont et permet une politique uniforme par IP/tenant/API key","Le gateway a acces aux bases de donnees des services","Le rate limiting est impossible dans les services individuels"],"answer":2,"explanation":"Le gateway est le point de passage oblige de toutes les requetes. Le rate limiting y est applique avant que les services ne soient sollicites. Trade-off : le gateway est un Single Point of Failure — il doit etre hautement disponible."},{"label":"Question 4","text":"Quel est le risque principal d'un API Gateway mal concu ?","options":["Il consomme trop de memoire","Il devient un SPOF (Single Point of Failure) et un goulot d'etranglement si trop de logique metier y est placee","Il empeche le deploiement de nouveaux services","Il bloque les requetes HTTPS"],"answer":1,"explanation":"Le gateway doit rester lean : routing, auth, rate limiting, logging. Si on y ajoute de la logique metier, de la transformation de donnees complexe ou de l'aggregation, il devient un monolithe deguise. Trade-off : simplicite gateway vs fonctionnalites."},{"label":"Question 5","text":"Dans quel cas le BFF est-il preferable a un API Gateway generique ?","options":["Quand on a un seul type de client","Quand differents clients (web, mobile, admin) ont des besoins de donnees tres differents et qu'on veut eviter le 'one API to rule them all'","Quand on n'a pas de microservices","Quand on veut reduire le nombre de backends"],"answer":1,"explanation":"Le mobile a besoin de reponses agregees (une seule requete), le web peut faire plusieurs appels, l'admin a besoin de champs differents. Un BFF par client optimise chaque experience. Trade-off : multiplication des backends a maintenir."}];let currentQuestion=0,score=0,answered=false;function renderQuestion(){const q=questions[currentQuestion],total=questions.length;document.getElementById('progressBar').style.width=((currentQuestion/total)*100)+'%';document.getElementById('progressText').textContent=`Question ${currentQuestion+1} / ${total}`;let html=`<div class="card"><p class="question-label">${q.label}</p><p class="question-text">${q.text}</p>`;if(q.code)html+=`<pre><code>${q.code}</code></pre>`;html+=`<ul class="options">`;q.options.forEach((opt,i)=>{html+=`<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`;});html+=`</ul><button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button><div class="feedback" id="feedback"></div></div>`;document.getElementById('quizContainer').innerHTML=html;document.querySelectorAll('input[name="q"]').forEach(r=>{r.addEventListener('change',()=>{document.getElementById('validateBtn').disabled=false;});});answered=false;}function validate(){if(answered){currentQuestion++;if(currentQuestion<questions.length)renderQuestion();else showScore();return;}answered=true;const selected=document.querySelector('input[name="q"]:checked');if(!selected)return;const val=parseInt(selected.value),q=questions[currentQuestion];const fb=document.getElementById('feedback'),btn=document.getElementById('validateBtn');document.querySelectorAll('input[name="q"]').forEach(r=>r.disabled=true);if(val===q.answer){score++;fb.className='feedback correct';fb.innerHTML=`<strong>Correct !</strong> ${q.explanation}`;}else{fb.className='feedback wrong';fb.innerHTML=`<strong>Incorrect.</strong> ${q.explanation}`;}btn.textContent=currentQuestion<questions.length-1?'Suivant':'Voir le score';}function showScore(){document.getElementById('quizContainer').classList.add('hidden');document.getElementById('progressBar').style.width='100%';document.getElementById('progressText').textContent='Termine !';const sc=document.getElementById('scoreContainer');sc.classList.remove('hidden');const pct=Math.round((score/questions.length)*100);let msg=pct===100?'Parfait !':pct>=60?'Bien joue !':'Continuez a reviser !';sc.innerHTML=`<div class="score">${score} / ${questions.length}</div><div class="score-label">${msg} (${pct}%)</div><button class="btn-restart" onclick="restart()">Recommencer</button>`;}function restart(){currentQuestion=0;score=0;answered=false;document.getElementById('scoreContainer').classList.add('hidden');document.getElementById('quizContainer').classList.remove('hidden');renderQuestion();}renderQuestion();</script></body></html>
